; ============================================================================
; rASN QUORUM-REPLICATED STATE CLUSTER profile.
;
; Build rDSN with plugins (`./run.sh build --build_plugins`), then launch:
;   ./codepilot serve config.rasn.state.ini
; or:
;   ./srepilot serve config.rasn.state.ini
;
; This self-contained profile starts one meta server and three replica servers in
; one process so the replicated rasn.state backend can be exercised on one machine.
; It proves quorum behavior but does NOT provide host-failure isolation. Production
; deployments run the meta service and each replica server in separate supervised
; processes/nodes, with all nodes pointing at the same [meta_server] server_list.
;
; Runtime hosts and clients reach this service through:
;   [rasn.service]
;   state_uri = dsn://rasn-cluster/rasn-state
; and the same [uri-resolver.dsn://rasn-cluster] block below.
;
; Keep partition_count = 1. The current rasn.state query API is a global prefix
; scan and does not yet fan out across replica groups; runtime-module sharding is
; independent and all shard mirrors remain durable in this one replicated group.
; ============================================================================

[modules]
dsn.tools.common
dsn.tools.emulator
dsn.tools.nfs
dsn.dist.uri.resolver
dsn.dist.service.meta_server
dsn.dist.service.stateful.type1

[core]
tool = nativerun
data_dir = rasn/state-cluster/data
toollets = tracer
start_nfs = true
pause_on_start = false
cli_local = false
logging_start_level = LOG_LEVEL_INFORMATION
logging_factory_name = dsn::tools::simple_logger

[network]
io_service_worker_count = 2

[apps.meta]
type = meta
arguments =
run = true
count = 1
ports = 27601
pools = THREAD_POOL_DEFAULT,THREAD_POOL_META_SERVER,THREAD_POOL_FD,THREAD_POOL_META_STATE

[apps.replica]
type = replica
arguments =
run = true
count = 3
ports = 37601
pools = THREAD_POOL_DEFAULT,THREAD_POOL_REPLICATION,THREAD_POOL_FD,THREAD_POOL_LOCAL_APP,THREAD_POOL_REPLICATION_LONG

[meta_server]
server_list = localhost:27601
min_live_node_count_for_unfreeze = 1

[replication.app]
app_name = rasn-state
app_type = rasn.state.replicated
partition_count = 1
max_replica_count = 3
stateful = true

[uri-resolver.dsn://rasn-cluster]
factory = partition_resolver_simple
arguments = localhost:27601

[task..default]
is_trace = true
is_profile = true
allow_inline = false
rpc_call_channel = RPC_CHANNEL_TCP
rpc_message_header_format = dsn
rpc_timeout_milliseconds = 5000
disk_write_fail_ratio = 0.0
disk_read_fail_ratio = 0.0

; Mutations must enter rDSN's type-1 replication layer. GET/QUERY/CHECKPOINT stay
; primary reads; RECOVER is classified as a write and rejected by the replicated
; app because learning/apply is the only valid recovery authority in this mode.
[task.RPC_RASN_STATE_PUT]
rpc_request_is_write_operation = true

[task.RPC_RASN_STATE_PUT_CONDITIONAL]
rpc_request_is_write_operation = true

[task.RPC_RASN_STATE_RECOVER]
rpc_request_is_write_operation = true

[task.RPC_FD_FAILURE_DETECTOR_PING]
is_trace = false
rpc_call_channel = RPC_CHANNEL_UDP

[task.RPC_FD_FAILURE_DETECTOR_PING_ACK]
is_trace = false
rpc_call_channel = RPC_CHANNEL_UDP

[task.LPC_RPC_TIMEOUT]
is_trace = false

[task.LPC_BEACON_CHECK]
is_trace = false

[task.LPC_DAEMON_APPS_CHECK_TIMER]
is_trace = false

[task.RPC_PREPARE]
rpc_request_resend_timeout_milliseconds = 8000

[threadpool..default]

[threadpool.THREAD_POOL_DEFAULT]
partitioned = false
worker_count = 8
worker_priority = THREAD_xPRIORITY_NORMAL

[threadpool.THREAD_POOL_REPLICATION]
partitioned = true
max_input_queue_length = 2560
worker_priority = THREAD_xPRIORITY_NORMAL

[threadpool.THREAD_POOL_META_STATE]
partitioned = false
worker_count = 1
worker_priority = THREAD_xPRIORITY_NORMAL

[replication]
prepare_timeout_ms_for_secondaries = 10000
prepare_timeout_ms_for_potential_secondaries = 20000
learn_timeout_ms = 30000
staleness_for_commit = 20
staleness_for_start_prepare_for_potential_secondary = 110
mutation_max_size_mb = 15
mutation_max_pending_time_ms = 20
mutation_2pc_min_replica_count = 2
prepare_list_max_size_mb = 250
request_batch_disabled = false
group_check_internal_ms = 100000
group_check_disabled = false
fd_disabled = false
fd_check_interval_seconds = 5
fd_beacon_interval_seconds = 3
fd_lease_seconds = 14
fd_grace_seconds = 15
working_dir = .
log_buffer_size_mb = 1
log_pending_max_ms = 100
log_file_size_mb = 32
log_batch_write = true
log_enable_shared_prepare = true
log_enable_private_commit = false
config_sync_interval_ms = 60000
