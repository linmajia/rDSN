; ============================================================================
; CodePilot APPLICATION config (thin).
;
; A rASN app is a thin TUI/GUI. ALL agent logic and services live in the rASN
; RUNTIME (config.rasn.ini), never here. An app cares about exactly two things:
;   1. WHERE its runtime is      -> [rasn.runtime]
;   2. the LLM serving endpoint  -> [rasn.model]
;
; This file therefore carries NO service-discovery ([rasn.service]) and NO
; service-deployment ([apps.rasn.registry|state|workflow|...]) config. Those are
; the runtime's concern; exposing them to a local app would be irrelevant noise.
; With a LOCAL runtime -- the default -- the runtime modules are
; created in-process on built-in defaults, and this thin config is all that loads.
;
; Deployment modes:
;   * LOCAL (default): run `./codepilot`. Modules run in-process; no
;     service config needed.
;   * REMOTE runtime: set [rasn.runtime] rasn_runtime_mode = distributed and give
;     the remote runtime address (commented [rasn.service] example at the bottom).
;   * LOCAL all-in-one runtime host: run `./codepilot --dsn`. That loads the full
;     runtime (config.rasn.ini), which in turn @include?'s THIS file to co-host
;     the CodePilot app beside the services in one process.
; ============================================================================

; ---- minimal rDSN bootstrap (so the app starts standalone) ------------------
[modules]
dsn.tools.common
dsn.tools.emulator
dsn.tools.nfs
dsn.dist.uri.resolver

[core]
tool = nativerun
data_dir = rasn/data
toollets = tracer, profiler
start_nfs = false
pause_on_start = false
cli_local = false
enable_default_app_mimic = true
logging_start_level = LOG_LEVEL_WARNING
logging_factory_name = dsn::tools::simple_logger

[apps.rasn.codepilot]
type = rasn.codepilot
arguments =
run = true
count = 1
pools = THREAD_POOL_DEFAULT

; ---- (1) WHERE the runtime is ----------------------------------------------
[rasn.runtime]
trace_file = rasn/traces/rasn.trace.jsonl
temp_dir =
; rasn_runtime_mode selects where the runtime modules live:
;   local       - in-process (default). Dispatches the module API via LPC when a
;                 co-hosted rDSN runtime node is present (`./codepilot --dsn`),
;                 otherwise builds the modules directly in-process.
;                 (`embedded`/`in-process` are accepted legacy aliases for `local`.)
;   distributed - every module is reached over RPC at the runtime endpoint (set
;                 the remote address in the [rasn.service] block below).
;   hybrid      - per-module: some in-process, some remote.
rasn_runtime_mode = local
rasn_runtime_provider =
rasn_runtime_state_prefix = rasn/runtime
rasn_runtime_strict = false

; ---- (2) LLM serving endpoint ----------------------------------------------
; Defaults to the built-in simulator when unset. Uncomment and edit to point this
; app's runtime at a real LLM endpoint (the full [rasn.model] tuning otherwise
; lives in the runtime's config.rasn.ini).
; [rasn.model]
; provider = copilot
; copilot_endpoint = https://api.githubcopilot.com/chat/completions
; copilot_model = gpt-4o-copilot
; copilot_token_env = RASN_COPILOT_TOKEN,GITHUB_COPILOT_TOKEN,COPILOT_TOKEN,GH_TOKEN

; ---- REMOTE runtime address (only for rasn_runtime_mode = distributed) ------
; A local app needs just ONE thing to use a remote runtime: its address. The
; per-service [rasn.service] map lives in the runtime's config.rasn.ini, not here.
; [rasn.service]
; rasn_runtime_host = 10.0.0.10
; rasn_runtime_port = 27107
