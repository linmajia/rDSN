; ============================================================================
; CodePilot APPLICATION config (thin client).
;
; A rASN app is a thin TUI/GUI client. ALL agent logic and services live in the
; rASN RUNTIME. An app cares about exactly two things:
;   1. WHERE its runtime is      -> [rasn.runtime]  (local, distributed, or hybrid)
;   2. the LLM serving endpoint  -> [rasn.model]
;
; This is ALWAYS the file the app loads (no config path on the command line). It
; boots standalone on built-in defaults and carries none of the runtime's service
; or deployment topology.
;
; MODE IS CONFIG-DRIVEN (not a command-line flag). [rasn.runtime] placement:
;   * local (default): the runtime modules run IN-PROCESS inside this app. Just
;     run `./codepilot`; no runtime host is needed.
;   * distributed / hybrid: the app reaches a separately deployed rASN RUNTIME
;     HOST over RPC. Set rasn_runtime_mode = distributed and the host address in
;     the [rasn.service] block below, then run `./codepilot` -- it attaches a
;     lightweight client node automatically and talks to the remote runtime. That
;     host is an independent deployment (see config.rasn.ini + `serve`); it may
;     run on a remote node or as a second process on this same machine.
;
; An app never needs `--dsn`. To DEPLOY the runtime itself, run the runtime host
; config (config.rasn.ini) with `./codepilot serve` -- that is a separate role.
; ============================================================================

; ---- OPTIONAL: local module tuning -----------------------------------------
; A LOCAL (in-process) runtime uses built-in module defaults. To override them
; (model/tool/overload/policy/... knobs) uncomment the include below; it pulls in
; the SHARED tuning defaults. Keep it FIRST so the app sections further down still
; win. Requires config.rasn.defaults.ini deployed beside this file, with the app
; run from its bin/install dir (rDSN resolves @include against the CWD). A
; distributed app does NOT need this -- tuning lives in the runtime host.
; @include config.rasn.defaults.ini

; ---- minimal rDSN bootstrap (so the app starts standalone) ------------------
[modules]
dsn.tools.common
dsn.tools.emulator
dsn.tools.nfs
dsn.dist.uri.resolver

[core]
tool = nativerun
data_dir = rasn/data
toollets = tracer, profiler
start_nfs = false
pause_on_start = false
cli_local = false
enable_default_app_mimic = true
logging_start_level = LOG_LEVEL_WARNING
logging_factory_name = dsn::tools::simple_logger

[apps.rasn.codepilot]
type = rasn.codepilot
arguments =
run = true
count = 1
pools = THREAD_POOL_DEFAULT

; ---- (1) WHERE the runtime is ----------------------------------------------
[rasn.runtime]
trace_file = rasn/traces/rasn.trace.jsonl
temp_dir =
; rasn_runtime_mode selects WHERE the runtime modules live (placement); it fully
; replaces the old `--dsn` flag:
;   local       - in-process inside this app (default). Modules are built directly
;                 in-process; no runtime host or client node is needed.
;                 (`embedded`/`in-process` are accepted legacy aliases for `local`.)
;   distributed - every module is reached over RPC at a separately deployed runtime
;                 host (set its address in the [rasn.service] block below); the app
;                 attaches a lightweight client node automatically to make the calls.
;   hybrid      - per-module: some in-process, some remote.
rasn_runtime_mode = local
rasn_runtime_provider =
rasn_runtime_state_prefix = rasn/runtime
rasn_runtime_strict = false

; ---- (2) LLM serving endpoint ----------------------------------------------
; Defaults to the built-in simulator when unset. Uncomment and edit to point this
; app's runtime at a real LLM endpoint (the full [rasn.model] tuning otherwise
; lives in the runtime's config.rasn.ini).
; [rasn.model]
; provider = copilot
; copilot_endpoint = https://api.githubcopilot.com/chat/completions
; copilot_model = gpt-4o-copilot
; copilot_token_env = RASN_COPILOT_TOKEN,GITHUB_COPILOT_TOKEN,COPILOT_TOKEN,GH_TOKEN

; ---- REMOTE runtime address (only for rasn_runtime_mode = distributed) ------
; A local app needs just ONE thing to use a remote runtime: its address. The
; per-service [rasn.service] map lives in the runtime's config.rasn.ini, not here.
; Any explicitly configured URI, host, or port is authoritative -- the app dials
; exactly this endpoint and does not fall back to registry discovery, so it always
; reaches the runtime you selected (discovery is only used for unconfigured modules).
; [rasn.service]
; rasn_runtime_host = 10.0.0.10
; rasn_runtime_port = 27107
