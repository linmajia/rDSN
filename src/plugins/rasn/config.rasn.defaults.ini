; ============================================================================
; rASN shared module TUNING defaults.
;
; Behavior knobs for the rASN runtime modules ([rasn.model], [rasn.tool],
; [rasn.overload], [rasn.policy], [rasn.state], [rasn.workflow], ...). These are
; identical whether a module runs locally (in-process, inside an app) or remotely
; (inside a runtime host), so they live in ONE shared file that:
;   * the runtime host config.rasn.ini @includes (see its trailing @include), and
;   * a LOCAL app's config.ini MAY optionally @include near the top to tune its
;     in-process runtime (commented out by default -- an app runs on built-in
;     defaults without it).
;
; This file contains NO rDSN infrastructure, NO [rasn.service] discovery, and NO
; [apps.*] deployment -- only module behavior. That is what makes it safe for a
; thin local app to include without inheriting any fleet-deployment topology.
;
; rDSN resolves a relative @include against the directory of the INCLUDING file
; (falling back to the process working directory only when the file is not found
; there), so these config files stay resolvable as long as they live together in
; one directory. Keeping them in the app's bin/install dir -- and, for a thin app
; that opts in, launching from that dir -- satisfies both resolution paths.
; ============================================================================

[rasn.coordinator]
max_retry_budget = 3

[rasn.coordination]
; Distributed coordination backend for single-writer ownership / leader election
; (reuses rDSN distributed_lock_service) and cluster-shared state (reuses rDSN
; meta_state_service). Backends:
;   inproc    - in-process single-node fallback (default; no external deps)
;   simple    - rDSN in-process provider; coordinates only within ONE in-process
;               facade instance (unit tests / single-writer dev), not across
;               processes or apps
;   zookeeper - rDSN ZooKeeper-backed provider (production HA); configure the
;               ensemble under [zookeeper] hosts_list
provider = inproc
lock_namespace = /rasn/locks
state_namespace = /rasn/state
acquire_timeout_ms = 5000
; Bounds state I/O, cancellation, unlock, and shutdown cleanup. A timed-out
; provider is quarantined rather than reused with an ambiguous lock outcome.
operation_timeout_ms = 5000
; Directory for the 'simple' backend durable log (ignored by inproc/zookeeper).
state_work_dir = .
;
; Optional authoritative circuit-breaker state for all four outbound dependency
; families: core-service RPC, runtime-module RPC, model providers, and remote
; agents. Default off preserves the process-local hot path. Cross-process
; protection requires provider = zookeeper; inproc/simple are useful only for
; single-process development. Shared-mode reads fail closed on coordination,
; record-version, or config-consistency errors.
shared_breaker_enabled = false
; Relative path used under state_namespace. Records are schema-versioned and
; keys are hex encoded below this prefix; lock IDs are bounded flat hashes.
shared_breaker_state_prefix = resilience/circuit_breakers
; Maximum time an allow/report transition waits for the per-key distributed lock.
shared_breaker_lock_timeout_ms = 1000
; Minimum lease for the one cluster-wide half-open probe. Each call also supplies
; its own timeout/retry budget; the larger request is then capped below, so a live
; probe is not replaced prematurely and a crashed probe still expires.
shared_breaker_probe_lease_ms = 120000
; Finite cap on the effective probe lease, including untrusted request budgets.
shared_breaker_max_probe_lease_ms = 600000
; Extra cooldown/lease margin for bounded physical-clock skew between NTP-synced nodes.
shared_breaker_clock_skew_ms = 5000

[rasn.workflow]
execution_lease_ms = 600000
execution_lease_renew_ms = 0
; How often a running executor re-reads its shared run record to observe a
; cancellation routed to a different instance than the lease holder. 0 disables
; the cross-instance probe (single-instance deployments do not need it).
cancel_probe_ms = 2000

[rasn.registry]
; Built-in coordinator/model/tool descriptors and standalone state/workflow/
; observability apps publish lease-tracked rasn.service.<name> capabilities when
; enabled. Host/port clients use those existing capabilities only after a
; retryable failure; registry's own configured group/URI is never self-resolved.
dynamic_registration = true
heartbeat_ms = 2000
lease_ms = 30000
; HA mode requires a nonzero sweep interval whenever lease_ms is nonzero,
; because only the elected writer is allowed to evaluate persisted timestamps.
sweep_interval_ms = 5000
registration_timeout_ms = 1000
; Default-off HA mode. When enabled, every rasn.registry frontend reads the same
; ZooKeeper-backed meta_state_service namespace, while one fenced primary owns
; mutations/lease sweeping. Requires [rasn.coordination] provider=zookeeper and
; the META_SERVER + partitioned DLOCK pools documented in config.rasn.ini; the
; registry rejects incomplete pool wiring before coordination startup. The current
; rDSN ZooKeeper provider reports transient disconnect and session expiry through
; the same ownership-loss path, so an active registry process fail-stops on either
; rather than risking a stale writer.
shared_state_enabled = false
shared_state_prefix = registry/v1
leader_resource = rasn.registry.primary
leader_acquire_timeout_ms = 1000
leader_retry_interval_ms = 1000
; The active writer omits tombstones when promoting a new exact epoch and
; periodically removes older committed record/marker children. Keep at least two
; epochs so readers racing a handoff can fail closed against the previous marker.
history_retained_epochs = 3
; 0 prunes after successful promotion only; nonzero also retries periodically.
history_prune_interval_ms = 60000
; Registry clients rotate an rDSN group after retryable transport/read failures
; or a standby rejection. Mutations retry only typed pre-apply rejections; they
; rotate but never replay an ambiguous timeout, in-flight network failure, or
; post-submission backend failure. Set client_max_attempts at least as high as
; the number of registry_addresses in [rasn.service].
client_max_attempts = 3
client_retry_backoff_ms = 50

[rasn.state]
checkpoint_dir = rasn/state
checkpoint_file = rasn-state.chkpt
journal_file = rasn/state/rasn-state.journal
recover_on_start =
; Healthy GET/QUERY calls cache a negative external-quarantine probe for this
; many milliseconds. Mutations and lifecycle operations always force a disk
; refresh, and observed quarantine remains latched until restart. During this
; interval reads may serve the last in-memory image after an external marker
; appears. Set 0 to probe on every read; 1000 bounds that read-detection latency
; without per-read stat I/O.
quarantine_probe_interval_ms = 1000
; Standalone state intentionally acknowledges each mutation only after its own
; durable journal flush. Use the rasn.state.replicated profile for rDSN-managed
; batching/quorum throughput rather than weakening this crash-durability contract.

[rasn.state.nfs]
enabled = false
; NFS is a coherent cold seed only: it runs when both local checkpoint and journal
; are absent, gives every download attempt fresh staging, and never combines an
; unversioned remote artifact with a local generation.
remote_host =
remote_port = 0
remote_checkpoint_dir =
remote_checkpoint_file = rasn-state.chkpt
remote_journal_file =
local_import_dir =
overwrite = true
; timeout_ms bounds a single NFS import attempt during recovery. The default is
; 20000 ms (20 seconds), which is conservative for service startup and remote
; state seeding. For interactive direct CLI deployments on local/LAN NFS, 5000
; is a common fail-fast override.
timeout_ms = 20000

[rasn.state.replica]
enabled = false
; Keep directory non-empty when enabled. An empty replica directory is treated as
; misconfiguration and should block persistence rather than silently disabling
; recovery protection. It must also resolve to storage distinct from every primary
; checkpoint/journal destination and staging name; startup fails on any alias.
directory = rasn/state/replica
recover = true

[rasn.metrics]
; rASN runtime metrics backed by rDSN perf counters (section "rasn").
; When enabled, the nucleus runtime bumps cumulative counters per event kind and
; records task/llm/tool latency percentiles. Metrics are exposed through the
; CodePilot CLI ("observe metrics [text|prometheus|json]") and the rDSN command
; manager ("rasn.metrics [text|prometheus|json]"). Set to false to make all metric
; updates no-ops. Percentiles are computed by rDSN's own perf-counter timers, so
; they update periodically rather than on every observation.
enabled = true

[rasn.model]
provider = simulator
endpoint =
model =
token_ref =
token_env =
token_command =
connect_timeout_sec = 10
request_timeout_sec = 120
copilot_endpoint = https://api.githubcopilot.com/chat/completions
copilot_model = gpt-4o-copilot
copilot_token_env = RASN_COPILOT_TOKEN,GITHUB_COPILOT_TOKEN,COPILOT_TOKEN,GH_TOKEN
ollama_endpoint = http://localhost:11434/api/chat
ollama_model = llama3.1
ollama_payload = ollama.chat
llama_cpp_endpoint = http://localhost:8080/v1/chat/completions
llama_cpp_model = local-model
lmstudio_endpoint = http://localhost:1234/v1/chat/completions
lmstudio_model = local-model
; Model-gateway circuit breaker. Guards network-backed model providers so a
; failing or hanging endpoint fails fast (before the provider's own retry loop)
; instead of piling up latency. This includes loopback HTTP providers (Ollama,
; llama.cpp, LM Studio); only true in-process providers such as the simulator are
; exempt. State is observable via the "rasn.resilience" command and surfaces
; in the model provider summary; trips and short-circuits are exported as the
; rasn_model_breaker_open_total / rasn_model_breaker_short_circuit_total metrics.
circuit_breaker_enabled = true
; Consecutive provider failures (while closed) required to open the breaker.
circuit_breaker_failure_threshold = 5
; Cooldown in ms after opening before a single half-open probe is admitted.
circuit_breaker_open_ms = 30000
; Model-gateway admission control. The overload-protection counterpart to the
; circuit breaker: a per-provider concurrency bulkhead caps simultaneous in-flight
; requests (fast-failing excess load) and applies graceful backpressure as load
; approaches the cap, smoothing bursts before they reach the endpoint. Like the
; breaker, only network-backed providers are guarded; in-process providers (e.g.
; the simulator) are exempt. State shows in "rasn.resilience"; rejected and
; delayed requests are exported as the rasn_model_admission_rejected_total /
; rasn_model_admission_delayed_total metrics.
admission_enabled = true
; Hard cap on concurrent in-flight model requests per provider (0 = unlimited).
max_concurrent_requests = 32
; In-flight level at which graceful backpressure begins (0 = no backpressure).
soft_concurrent_requests = 16
; Upper bound in ms on the graceful admission backpressure delay.
max_backpressure_ms = 200
;
; Resilience: client-side rate limiter. A per-provider token bucket paces outbound
; model calls under the provider's published quota (requests/minute), so the agent
; stays under hosted-API limits instead of discovering them as HTTP 429s and wasted
; retries. The bucket starts full (allowing a burst), refills at the sustained rate,
; and -- when briefly ahead of the rate -- either paces a request with a short delay
; or, if the wait would exceed rate_limit_max_wait_ms, fast-fails it. Disabled by
; default (requests_per_min = 0 = unlimited) so single-agent CLI use is unchanged;
; set a rate when pointing rASN at a metered endpoint. Like the breaker and admission
; control, only network-backed providers are governed; in-process providers (e.g. the
; simulator) are exempt. State shows in "rasn.resilience"; rejected and paced requests
; are exported as the rasn_model_rate_limited_total / rasn_model_rate_delayed_total
; metrics.
rate_limit_enabled = true
; Sustained request rate per provider in requests/minute (0 = unlimited / disabled).
rate_limit_requests_per_min = 0
; Burst capacity in tokens (0 = about one second of the sustained rate, minimum 1).
rate_limit_burst = 0
; Max ms a request may be paced waiting for a token before it is rejected instead
; (0 = never delay: a request that finds the bucket empty is rejected immediately).
rate_limit_max_wait_ms = 1000
; Model-gateway token/cost budget. The rate limiter above governs request COUNT;
; this budget governs weighted THROUGHPUT by charging each request its estimated
; token cost, so it can bound tokens-per-minute and metered spend that a request
; counter cannot (one large prompt may cost many times a small one). It reuses the
; same token bucket, injected dsn_now_ms clock, and perf-counter export; the charge
; is estimated from prompt size only (system + user + context characters), so it is
; deterministic and replay-safe and never depends on the provider response. Like
; the rate limiter it governs only network-backed providers. Disabled by default
; (cost_tokens_per_min = 0 = unlimited) so single-agent CLI use is unchanged; set a
; budget when pointing rASN at a metered endpoint. State shows in "rasn.resilience";
; rejected and paced requests are exported as the rasn_model_cost_limited_total /
; rasn_model_cost_delayed_total metrics.
cost_budget_enabled = true
; Sustained token budget per provider in estimated tokens/minute (0 = unlimited).
cost_tokens_per_min = 0
; Burst capacity in estimated tokens (0 = about one second of the sustained budget,
; minimum 1). Size this >= the largest single-request estimate you intend to admit.
cost_burst_tokens = 0
; Max ms a request may be paced waiting for token budget before it is rejected
; instead (0 = never delay: reject immediately when the budget is exhausted).
cost_max_wait_ms = 1000
; Prompt characters per estimated token (0 = default 4, the common ~4-chars/token
; heuristic for byte-pair tokenizers).
cost_chars_per_token = 0
; Completion allowance as a percent of estimated input tokens added to the charge
; (0 = default 150 = +50% for the completion; 100 = charge input tokens only).
cost_completion_percent = 0

[rasn.tool]
; Tool-gateway admission control. Per-tool concurrency bulkheads protect local
; shells, filesystem tools, and future remote tool adapters from thundering-herd
; execution while keeping replay and policy-denied calls outside the governor.
; State shows in "rasn.resilience"; rejected and delayed invocations are exported
; as rasn_tool_admission_rejected_total / rasn_tool_admission_delayed_total.
admission_enabled = true
; Hard cap on concurrent in-flight invocations per tool name (0 = unlimited).
max_concurrent_requests = 16
; In-flight level at which graceful backpressure begins (0 = no backpressure).
soft_concurrent_requests = 8
; Upper bound in ms on the graceful admission backpressure delay.
max_backpressure_ms = 100
;
; Tool-gateway rate limiter. A per-tool token bucket can pace high-frequency
; tool calls (for example shell/network adapters) under an operator-defined
; request rate. Disabled by default (requests_per_min = 0) to preserve normal
; single-agent CLI behavior; set a rate for production tool adapters that need
; quota protection. State shows in "rasn.resilience"; rejected and paced calls
; are exported as rasn_tool_rate_limited_total / rasn_tool_rate_delayed_total.
rate_limit_enabled = true
; Sustained invocation rate per tool name in requests/minute (0 = unlimited).
rate_limit_requests_per_min = 0
; Burst capacity in tokens (0 = about one second of the sustained rate, minimum 1).
rate_limit_burst = 0
; Max ms an invocation may be paced waiting for a token before it is rejected.
rate_limit_max_wait_ms = 1000

[rasn.remote_agent]
; Coordinator remote-agent circuit breaker. Guards outbound RPC dispatches to
; dynamically registered or service-mode agents. Only retryable dependency
; failures (transport errors or retryable remote responses) count against the
; breaker; deterministic application denials do not poison the agent.
circuit_breaker_enabled = true
; Consecutive retryable remote-agent failures required to open the breaker.
circuit_breaker_failure_threshold = 5
; Cooldown in ms after opening before a single half-open probe is admitted.
circuit_breaker_open_ms = 30000
; Remote-agent admission control. Per-agent concurrency bulkheads cap coordinator
; fan-out toward each remote service and apply graceful backpressure near the cap.
; State shows in "rasn.resilience"; rejected and delayed dispatches are exported
; as rasn_remote_agent_admission_rejected_total /
; rasn_remote_agent_admission_delayed_total.
admission_enabled = true
; Hard cap on concurrent in-flight coordinator RPC dispatches per agent (0 = unlimited).
max_concurrent_requests = 64
; In-flight level at which graceful backpressure begins (0 = no backpressure).
soft_concurrent_requests = 32
; Upper bound in ms on graceful remote-agent admission backpressure delay.
max_backpressure_ms = 200
; Remote-agent rate limiter. Disabled by default (requests_per_min = 0) so the
; single-node CLI and smoke tests remain unchanged; set a rate for remote agents
; that expose explicit request quotas.
rate_limit_enabled = true
; Sustained coordinator RPC dispatch rate per agent in requests/minute (0 = unlimited).
rate_limit_requests_per_min = 0
; Burst capacity in tokens (0 = about one second of the sustained rate, minimum 1).
rate_limit_burst = 0
; Max ms a dispatch may be paced waiting for a token before it is rejected.
rate_limit_max_wait_ms = 1000

[rasn.overload]
; Process-wide overload budget. Unlike the per-dependency gateways above (model,
; tool, remote-agent), these controls bound TOTAL in-flight work and throughput
; across every dependency at the coordinator invoke chokepoint -- a single global
; bulkhead + a single global rate ceiling. They protect the host itself (threads,
; memory, sockets) when many dependencies are busy at once, complementing the
; per-dependency limits. State shows in "rasn.resilience" and CodePilot's
; "observe resilience"; rejections and pacing are exported as
; rasn_overload_admission_rejected_total / rasn_overload_admission_delayed_total /
; rasn_overload_rate_limited_total / rasn_overload_rate_delayed_total.
;
; The concurrency defaults are 0 (disabled/passthrough) so zero-config behavior
; is unchanged: operators opt in by sizing a global cap to their host.
admission_enabled = true
; Hard cap on concurrent in-flight coordinator operations across ALL dependencies
; (0 = unlimited). Each top-level invoke() counts once.
max_concurrent_operations = 0
; In-flight level at which graceful process-wide backpressure begins (0 = none).
soft_concurrent_operations = 0
; Upper bound in ms on graceful process-wide admission backpressure delay.
max_backpressure_ms = 200
; Process-wide rate limiter. Disabled by default (requests_per_min = 0) so the
; single-node CLI and smoke tests remain unchanged; set a ceiling to cap the
; aggregate operation rate the process will admit.
rate_limit_enabled = true
; Sustained process-wide operation rate in requests/minute (0 = unlimited).
rate_limit_requests_per_min = 0
; Burst capacity in tokens (0 = about one second of the sustained rate, minimum 1).
rate_limit_burst = 0
; Max ms an operation may be paced waiting for a process-wide token before it is rejected.
rate_limit_max_wait_ms = 1000

