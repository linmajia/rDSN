; ============================================================================
; rASN QUORUM-REPLICATED RUNTIME MODULES profile.
;
; Build rDSN with plugins (`./run.sh build --build_plugins`), then launch:
;   ./codepilot serve config.rasn.runtime.replicated.ini "meta;replica"
; or:
;   ./srepilot serve config.rasn.runtime.replicated.ini "meta;replica"
;
; This development profile starts one meta server and three replica servers in
; one process. Each runtime module is a separate native rDSN type-1 table so it
; has its own placement, mutation log, checkpoint stream, and failover boundary.
; Four modules support natural-key sharding. Message bus, budget, and blackboard
; use four partitions here; human interaction remains one partition by default.
; Production deployments run meta and replica servers in separate supervised
; processes/nodes while retaining the same app names and partition counts.
;
; The profile intentionally disables the legacy rasn.state mutation mirror:
; each module table's quorum log and decree-named checkpoints are authoritative.
; ============================================================================

[modules]
dsn.tools.common
dsn.tools.emulator
dsn.tools.nfs
dsn.dist.uri.resolver
dsn.dist.service.meta_server
dsn.dist.service.stateful.type1

[core]
tool = nativerun
data_dir = rasn/runtime-replica-cluster/data
toollets = tracer
start_nfs = true
pause_on_start = false
cli_local = false
logging_start_level = LOG_LEVEL_INFORMATION
logging_factory_name = dsn::tools::simple_logger

[network]
io_service_worker_count = 2

[apps.meta]
type = meta
arguments =
run = true
count = 1
ports = 27701
pools = THREAD_POOL_DEFAULT,THREAD_POOL_META_SERVER,THREAD_POOL_FD,THREAD_POOL_META_STATE

[apps.replica]
type = replica
arguments =
run = true
count = 3
ports = 37701
pools = THREAD_POOL_DEFAULT,THREAD_POOL_REPLICATION,THREAD_POOL_FD,THREAD_POOL_LOCAL_APP,THREAD_POOL_REPLICATION_LONG

[meta_server]
server_list = localhost:27701
min_live_node_count_for_unfreeze = 1

[meta_server.apps.agent_control]
app_name = rasn-runtime-agent-control
app_type = rasn.runtime.agent_control.replicated
partition_count = 1
max_replica_count = 3
stateful = true

[meta_server.apps.message_bus]
app_name = rasn-runtime-message-bus
app_type = rasn.runtime.message_bus.replicated
partition_count = 4
max_replica_count = 3
stateful = true

[meta_server.apps.task_kernel]
app_name = rasn-runtime-task-kernel
app_type = rasn.runtime.task_kernel.replicated
partition_count = 1
max_replica_count = 3
stateful = true

[meta_server.apps.determinism]
app_name = rasn-runtime-determinism
app_type = rasn.runtime.determinism.replicated
partition_count = 1
max_replica_count = 3
stateful = true

[meta_server.apps.capability]
app_name = rasn-runtime-capability
app_type = rasn.runtime.capability.replicated
partition_count = 1
max_replica_count = 3
stateful = true

[meta_server.apps.budget]
app_name = rasn-runtime-budget
app_type = rasn.runtime.budget.replicated
partition_count = 4
max_replica_count = 3
stateful = true

[meta_server.apps.recovery]
app_name = rasn-runtime-recovery
app_type = rasn.runtime.recovery.replicated
partition_count = 1
max_replica_count = 3
stateful = true

[meta_server.apps.blackboard]
app_name = rasn-runtime-blackboard
app_type = rasn.runtime.blackboard.replicated
partition_count = 4
max_replica_count = 3
stateful = true

[meta_server.apps.contract]
app_name = rasn-runtime-contract
app_type = rasn.runtime.contract.replicated
partition_count = 1
max_replica_count = 3
stateful = true

[meta_server.apps.human_interaction]
app_name = rasn-runtime-human-interaction
app_type = rasn.runtime.human_interaction.replicated
partition_count = 1
max_replica_count = 3
stateful = true

[meta_server.apps.sandbox]
app_name = rasn-runtime-sandbox
app_type = rasn.runtime.sandbox_runtime.replicated
partition_count = 1
max_replica_count = 3
stateful = true

[uri-resolver.dsn://rasn-runtime]
factory = partition_resolver_simple
arguments = localhost:27701

[rasn.runtime]
rasn_runtime_provider = distributed
rasn_runtime_strict = true

[rasn.service]
agent_control_plane_uri = dsn://rasn-runtime/rasn-runtime-agent-control
agent_message_bus_uri = dsn://rasn-runtime/rasn-runtime-message-bus
task_orchestration_kernel_uri = dsn://rasn-runtime/rasn-runtime-task-kernel
determinism_ledger_uri = dsn://rasn-runtime/rasn-runtime-determinism
capability_directory_uri = dsn://rasn-runtime/rasn-runtime-capability
resource_budget_uri = dsn://rasn-runtime/rasn-runtime-budget
recovery_supervisor_uri = dsn://rasn-runtime/rasn-runtime-recovery
blackboard_uri = dsn://rasn-runtime/rasn-runtime-blackboard
contract_verifier_uri = dsn://rasn-runtime/rasn-runtime-contract
human_interaction_uri = dsn://rasn-runtime/rasn-runtime-human-interaction
sandbox_runtime_uri = dsn://rasn-runtime/rasn-runtime-sandbox
agent_message_bus_shard_count = 4
resource_budget_shard_count = 4
blackboard_shard_count = 4
human_interaction_shard_count = 1
rasn_runtime_registry_discovery_enabled = false
rasn_runtime_registry_registration_enabled = false
rasn_runtime_idempotency_enabled = true
; Native replica eviction is a protocol rule, not a node-local tuning choice.
; Every native runtime app fails closed unless this remains exactly 8192.
rasn_runtime_dedup_capacity = 8192
rasn_runtime_native_replication_enabled = true
rasn_runtime_state_hydration_enabled = false
rasn_runtime_state_mirroring_enabled = false
rasn_runtime_ownership_gate_enabled = false
; Shared-token auth cannot safely run after type-1 commit, so native runtime apps
; fail closed if it is enabled. Isolate this development cluster at the network/
; transport layer.
rasn_runtime_auth_enabled = false
rasn_runtime_auth_token =

[task..default]
is_trace = true
is_profile = true
allow_inline = false
rpc_call_channel = RPC_CHANNEL_TCP
rpc_message_header_format = dsn
rpc_timeout_milliseconds = 5000
disk_write_fail_ratio = 0.0
disk_read_fail_ratio = 0.0

; Only these parallel write codes enter type-1 replication. The original module
; codes remain direct primary reads; replicated handlers reject a mutation sent
; on a read code and reject a read sent on a write code.
[task.RPC_RASN_AGENT_CONTROL_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_MESSAGE_BUS_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_TASK_ORCHESTRATION_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_DETERMINISM_LEDGER_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_CAPABILITY_DIRECTORY_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_RESOURCE_BUDGET_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_RECOVERY_SUPERVISOR_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_BLACKBOARD_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_CONTRACT_VERIFIER_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_HUMAN_INTERACTION_WRITE]
rpc_request_is_write_operation = true

[task.RPC_RASN_SANDBOX_RUNTIME_WRITE]
rpc_request_is_write_operation = true

[task.RPC_FD_FAILURE_DETECTOR_PING]
is_trace = false
rpc_call_channel = RPC_CHANNEL_UDP

[task.RPC_FD_FAILURE_DETECTOR_PING_ACK]
is_trace = false
rpc_call_channel = RPC_CHANNEL_UDP

[task.LPC_RPC_TIMEOUT]
is_trace = false

[task.LPC_BEACON_CHECK]
is_trace = false

[task.LPC_DAEMON_APPS_CHECK_TIMER]
is_trace = false

[task.RPC_PREPARE]
rpc_request_resend_timeout_milliseconds = 8000

[threadpool..default]

[threadpool.THREAD_POOL_DEFAULT]
partitioned = false
worker_count = 8
worker_priority = THREAD_xPRIORITY_NORMAL

[threadpool.THREAD_POOL_REPLICATION]
partitioned = true
max_input_queue_length = 2560
worker_priority = THREAD_xPRIORITY_NORMAL

[threadpool.THREAD_POOL_META_STATE]
partitioned = false
worker_count = 1
worker_priority = THREAD_xPRIORITY_NORMAL

[replication]
prepare_timeout_ms_for_secondaries = 10000
prepare_timeout_ms_for_potential_secondaries = 20000
learn_timeout_ms = 30000
staleness_for_commit = 20
staleness_for_start_prepare_for_potential_secondary = 110
mutation_max_size_mb = 15
mutation_max_pending_time_ms = 20
mutation_2pc_min_replica_count = 2
prepare_list_max_size_mb = 250
request_batch_disabled = false
group_check_internal_ms = 100000
group_check_disabled = false
fd_disabled = false
fd_check_interval_seconds = 5
fd_beacon_interval_seconds = 3
fd_lease_seconds = 14
fd_grace_seconds = 15
working_dir = .
log_buffer_size_mb = 1
log_pending_max_ms = 100
log_file_size_mb = 32
log_batch_write = true
log_enable_shared_prepare = true
log_enable_private_commit = false
config_sync_interval_ms = 60000
