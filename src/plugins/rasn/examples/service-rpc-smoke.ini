[modules]
dsn.tools.common
dsn.tools.emulator
dsn.tools.nfs
dsn.dist.uri.resolver

[apps..default]
run = true
count = 1

[apps.rasn.registry]
type = rasn.registry
arguments =
run = true
count = 1
ports = 27100
pools = THREAD_POOL_DEFAULT

[apps.rasn.llm.agent]
type = rasn.llm.agent
arguments =
run = true
count = 1
ports = 27102
pools = THREAD_POOL_DEFAULT

[apps.rasn.tool.agent]
type = rasn.tool.agent
arguments =
run = true
count = 1
ports = 27103
pools = THREAD_POOL_DEFAULT

[apps.rasn.state]
type = rasn.state
arguments =
run = true
count = 1
ports = 27104
pools = THREAD_POOL_DEFAULT

[apps.rasn.coordinator]
type = rasn.coordinator
arguments =
run = true
count = 1
ports = 27101
pools = THREAD_POOL_DEFAULT

[apps.rasn.workflow]
type = rasn.workflow
arguments =
run = true
count = 1
ports = 27105
pools = THREAD_POOL_DEFAULT,THREAD_POOL_RASN_WORKFLOW

[apps.rasn.observability]
type = rasn.observability
arguments =
run = true
count = 1
ports = 27106
pools = THREAD_POOL_DEFAULT

[apps.rasn.codepilot]
type = rasn.codepilot
arguments = selftest rasn-state\service-rpc-smoke.chkpt
run = true
count = 1
pools = THREAD_POOL_DEFAULT

[rasn.service]
host = localhost
registry_uri =
registry_port = 27100
coordinator_uri =
coordinator_port = 27101
llm_agent_uri =
llm_agent_port = 27102
tool_agent_uri =
tool_agent_port = 27103
state_uri =
state_port = 27104
workflow_uri =
workflow_port = 27105
observability_uri =
observability_port = 27106

[rasn.rpc]
timeout_ms = 5000

[rasn.coordinator]
max_retry_budget = 3

[rasn.workflow]
execution_lease_ms = 600000
execution_lease_renew_ms = 0

[rasn.registry]
dynamic_registration = true
heartbeat_ms = 2000
lease_ms = 30000
sweep_interval_ms = 5000
registration_timeout_ms = 1000

[rasn.state]
checkpoint_dir = rasn-state
checkpoint_file = service-rpc-smoke.chkpt
journal_file = rasn-state\service-rpc-smoke.journal
recover_on_start =

[rasn.state.replica]
enabled = false
directory = rasn-state-replica
recover = true

[rasn.runtime]
trace_file = rasn-state\service-rpc-smoke.trace.jsonl
temp_dir =

[rasn.model]
provider = simulator
endpoint =
model =
token_ref =
token_env =
token_command =
connect_timeout_sec = 10
request_timeout_sec = 120

[rasn.tool]
admission_enabled = true
max_concurrent_requests = 16
soft_concurrent_requests = 8
max_backpressure_ms = 100
rate_limit_enabled = true
rate_limit_requests_per_min = 0
rate_limit_burst = 0
rate_limit_max_wait_ms = 1000

[rasn.remote_agent]
circuit_breaker_enabled = true
circuit_breaker_failure_threshold = 5
circuit_breaker_open_ms = 30000
admission_enabled = true
max_concurrent_requests = 64
soft_concurrent_requests = 32
max_backpressure_ms = 200
rate_limit_enabled = true
rate_limit_requests_per_min = 0
rate_limit_burst = 0
rate_limit_max_wait_ms = 1000

[rasn.codepilot.tools]
allow_write = false
allow_shell = false
allow_network = false
require_write_approval = true
require_shell_approval = true
shell_allowed_commands =
shell_working_directory =
shell_executor = local
shell_container_template =
shell_timeout_ms = 300000
max_tool_output_bytes = 65536
artifact_dir = rasn-artifacts
workspace_root =
redaction_enabled = true
redact_env_names = RASN_COPILOT_TOKEN,GITHUB_COPILOT_TOKEN,COPILOT_TOKEN,GH_TOKEN,OPENAI_API_KEY,ANTHROPIC_API_KEY,AZURE_OPENAI_API_KEY
redact_literal_values =
redact_min_secret_length = 8

[rasn.policy]
allow_write = false
allow_shell = false
allow_network = false
require_write_approval = true
require_shell_approval = true
shell_allowed_commands =
shell_working_directory =
shell_executor = local
shell_container_template =
shell_timeout_ms = 300000
max_tool_output_bytes = 65536
artifact_dir = rasn-artifacts
workspace_root =
redaction_enabled = true
redact_env_names = RASN_COPILOT_TOKEN,GITHUB_COPILOT_TOKEN,COPILOT_TOKEN,GH_TOKEN,OPENAI_API_KEY,ANTHROPIC_API_KEY,AZURE_OPENAI_API_KEY
redact_literal_values =
redact_min_secret_length = 8

[core]
tool = nativerun
toollets = tracer, profiler
pause_on_start = false
cli_local = false
enable_default_app_mimic = true
logging_start_level = LOG_LEVEL_WARNING
logging_factory_name = dsn::tools::simple_logger

[tools.emulator]
random_seed = 2756568580
use_given_random_seed = true

[network]
io_service_worker_count = 2

[task..default]
is_trace = true
is_profile = true
allow_inline = false
rpc_call_channel = RPC_CHANNEL_TCP
rpc_message_header_format = dsn
rpc_timeout_milliseconds = 5000

[threadpool..default]

[threadpool.THREAD_POOL_DEFAULT]
partitioned = false
worker_count = 2
worker_priority = THREAD_xPRIORITY_NORMAL

[threadpool.THREAD_POOL_RASN_WORKFLOW]
partitioned = false
worker_count = 2
worker_priority = THREAD_xPRIORITY_NORMAL
