type = rasn.registry
arguments =
run = true
count = 1
ports = 27100
pools = THREAD_POOL_DEFAULT

[apps.rasn.llm.agent]
type = rasn.llm.agent
arguments =
run = true
count = 1
ports = 27102
pools = THREAD_POOL_DEFAULT

[apps.rasn.tool.agent]
type = rasn.tool.agent
arguments =
run = true
count = 1
ports = 27103
pools = THREAD_POOL_DEFAULT

[apps.rasn.state]
type = rasn.state
arguments =
run = true
count = 1
ports = 27104
pools = THREAD_POOL_DEFAULT

[apps.rasn.coordinator]
type = rasn.coordinator
arguments =
run = true
count = 1
ports = 27101
pools = THREAD_POOL_DEFAULT

[apps.rasn.workflow]
type = rasn.workflow
arguments =
run = true
count = 1
ports = 27105
pools = THREAD_POOL_DEFAULT,THREAD_POOL_RASN_WORKFLOW

[apps.rasn.observability]
type = rasn.observability
arguments =
run = true
count = 1
ports = 27106
