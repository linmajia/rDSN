[rasn.service]
host = localhost
registry_uri =
registry_port = 27100
coordinator_uri =
coordinator_port = 27101
llm_agent_uri =
llm_agent_port = 27102
tool_agent_uri =
tool_agent_port = 27103
state_uri =
state_port = 27104
workflow_uri =
workflow_port = 27105
observability_uri =
observability_port = 27106

[rasn.rpc]
timeout_ms = 5000

[rasn.coordinator]
max_retry_budget = 3

[rasn.workflow]
execution_lease_ms = 600000
execution_lease_renew_ms = 0

[rasn.registry]
dynamic_registration = true
heartbeat_ms = 2000
lease_ms = 30000
sweep_interval_ms = 5000
registration_timeout_ms = 1000

[rasn.state]
checkpoint_dir = rasn-state
checkpoint_file = rasn-state.chkpt
journal_file = rasn-state\rasn-state.journal
recover_on_start =

[rasn.state.nfs]
enabled = false
remote_host =
remote_port = 0
remote_checkpoint_dir =
remote_checkpoint_file = rasn-state.chkpt
remote_journal_file =
local_import_dir =
overwrite = true
timeout_ms = 20000

[rasn.state.replica]
enabled = false
directory = rasn-state-replica
recover = true

[rasn.runtime]
trace_file =
temp_dir =

[rasn.metrics]
; rASN runtime metrics backed by rDSN perf counters (section "rasn").
; When enabled, the nucleus runtime bumps cumulative counters per event kind and
; records task/llm/tool latency percentiles. Metrics are exposed through the
; CodePilot CLI ("observe metrics [text|prometheus|json]") and the rDSN command
; manager ("rasn.metrics [text|prometheus|json]"). Set to false to make all metric
; updates no-ops. Percentiles are computed by rDSN's own perf-counter timers, so
; they update periodically rather than on every observation.
enabled = true

[rasn.model]
provider = simulator
endpoint =
model =
token_ref =
token_env =
token_command =
connect_timeout_sec = 10
request_timeout_sec = 120
copilot_endpoint = https://api.githubcopilot.com/chat/completions
copilot_model = gpt-4o-copilot
copilot_token_env = RASN_COPILOT_TOKEN,GITHUB_COPILOT_TOKEN,COPILOT_TOKEN,GH_TOKEN
ollama_endpoint = http://localhost:11434/api/chat
ollama_model = llama3.1
ollama_payload = ollama.chat
llama_cpp_endpoint = http://localhost:8080/v1/chat/completions
llama_cpp_model = local-model
lmstudio_endpoint = http://localhost:1234/v1/chat/completions
lmstudio_model = local-model
; Model-gateway circuit breaker. Guards remote model providers so a failing or
; hanging endpoint fails fast (before the provider's own retry loop) instead of
; piling up latency. Local/in-process providers (e.g. the simulator) never trip
; a breaker. State is observable via the "rasn.resilience" command and surfaces
; in the model provider summary; trips and short-circuits are exported as the
; rasn_model_breaker_open_total / rasn_model_breaker_short_circuit_total metrics.
circuit_breaker_enabled = true
; Consecutive provider failures (while closed) required to open the breaker.
circuit_breaker_failure_threshold = 5
; Cooldown in ms after opening before a single half-open probe is admitted.
circuit_breaker_open_ms = 30000

[rasn.llm]
provider = simulator
endpoint =
model =
token_env =
token_command =

[rasn.codepilot.tools]
allow_write = false
allow_shell = false
allow_network = false
require_write_approval = true
require_shell_approval = true
shell_allowed_commands =
shell_working_directory =
shell_executor = local
shell_container_template =
shell_timeout_ms = 300000
max_tool_output_bytes = 65536
artifact_dir = rasn-artifacts
workspace_root =
redaction_enabled = true
redact_env_names = RASN_COPILOT_TOKEN,GITHUB_COPILOT_TOKEN,COPILOT_TOKEN,GH_TOKEN,OPENAI_API_KEY,ANTHROPIC_API_KEY,AZURE_OPENAI_API_KEY
redact_literal_values =
redact_min_secret_length = 8

[rasn.policy]
allow_write = false
allow_shell = false
allow_network = false
require_write_approval = true
require_shell_approval = true
shell_allowed_commands =
shell_working_directory =
shell_executor = local
shell_container_template =
shell_timeout_ms = 300000
max_tool_output_bytes = 65536
artifact_dir = rasn-artifacts
workspace_root =
redaction_enabled = true
redact_env_names = RASN_COPILOT_TOKEN,GITHUB_COPILOT_TOKEN,COPILOT_TOKEN,GH_TOKEN,OPENAI_API_KEY,ANTHROPIC_API_KEY,AZURE_OPENAI_API_KEY
redact_literal_values =
redact_min_secret_length = 8

[core]
tool = nativerun
toollets = tracer, profiler
start_nfs = false
pause_on_start = false
cli_local = false
enable_default_app_mimic = true
logging_start_level = LOG_LEVEL_WARNING
logging_factory_name = dsn::tools::simple_logger

[tools.emulator]
random_seed = 2756568580
use_given_random_seed = true

[network]
io_service_worker_count = 2

[task..default]
is_trace = true
is_profile = true
allow_inline = false
rpc_call_channel = RPC_CHANNEL_TCP
rpc_message_header_format = dsn
rpc_timeout_milliseconds = 5000

[threadpool..default]

[threadpool.THREAD_POOL_DEFAULT]
partitioned = false
worker_count = 2
worker_priority = THREAD_xPRIORITY_NORMAL

[threadpool.THREAD_POOL_RASN_WORKFLOW]
partitioned = false
worker_count = 2
worker_priority = THREAD_xPRIORITY_NORMAL
