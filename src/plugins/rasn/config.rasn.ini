; ============================================================================
; rASN RUNTIME HOST config -- deploys the distributed agent runtime as services.
;
; This file configures a node that HOSTS rASN runtime services (registry, state,
; workflow, coordinator, observability, the LLM/tool agents, and the runtime
; module apps). It is an ordinary rDSN service configuration. Run it with
;   ./srepilot serve        (or the deprecated alias  ./srepilot --dsn)
; to bring up a standalone runtime host; `serve` blocks and runs the fleet.
;
; The runtime host and an app are INDEPENDENT deployment units. This host holds
; NO app gateway of its own -- an app (CodePilot / SREPilot) runs as a SEPARATE
; client process (apps/<app>/config.ini) and reaches this host over RPC when its
; [rasn.runtime] placement is `distributed`. The host may sit on a dedicated
; remote node or be co-located on the same machine as the app (two processes on
; one box) -- the app never needs to know where or how the runtime is deployed.
;
; No config path is named on the command line: the binary auto-detects this file
; next to itself in `serve` mode. It carries NO [apps.rasn.codepilot] /
; [apps.rasn.srepilot] gateway on purpose -- rDSN validates every [apps.*] type at
; load and each binary registers only its own gateway type, so a gateway lives
; only in that app's own config.ini. Shared module tuning is pulled in from
; config.rasn.defaults.ini via the @include at the end of this file.
;
; SECTION FAMILIES (why one host file has so many sections: they answer four
; different questions and stay deliberately separate so this SAME file drives
; both a single-node and a distributed multi-node runtime):
;   1. rDSN INFRASTRUCTURE  [modules] [core] [network] [task..default]
;                           [threadpool.*] [rasn.rpc] [tools.emulator]
;   2. service DISCOVERY    [rasn.service]  -- logical service name -> host:port.
;                           THE family that changes local vs remote: repoint an
;                           endpoint to move or scale a service onto another node.
;   3. service DEPLOYMENT   [apps.rasn.*]   -- which service apps THIS node runs,
;                           on what port/pool (rDSN's native app model).
;   4. module TUNING        [rasn.<module>] -- behavior knobs, shared with local
;                           apps; kept in config.rasn.defaults.ini (@include'd).
; Families 2 & 3 are what an operator edits per node; 1 & 4 stay the same
; everywhere. Keeping them apart is what makes the local-or-remote model work.
; ============================================================================

[modules]
dsn.tools.common
dsn.tools.emulator
dsn.tools.nfs
dsn.dist.uri.resolver

[apps..default]
run = true
count = 1

[rasn.service]
host = localhost
registry_uri =
; Optional HA frontend set. Precedence is registry_uri, then this group, then the
; legacy registry_host/registry_port (or host/registry_port) pair. rDSN keeps a
; rotating group leader; bounded rasn.registry failover moves query/list/readiness
; traffic and definitely-unapplied mutations to another frontend. Ambiguous
; mutation outcomes are returned rather than replayed.
; All listed frontends must share the ZooKeeper registry state configured below.
registry_addresses =
registry_port = 27100
coordinator_uri =
coordinator_port = 27101
llm_agent_uri =
llm_agent_port = 27102
tool_agent_uri =
tool_agent_port = 27103
; Set this to dsn://rasn-cluster/rasn-state when deploying the optional
; quorum-replicated state profile from config.rasn.state.ini. Keep the direct
; host/port default for the standalone state app below.
state_uri =
state_port = 27104
; A runtime host using that URI must load dsn.dist.uri.resolver (already listed
; above) and carry the same resolver mapping as the state cluster:
; [uri-resolver.dsn://rasn-cluster]
; factory = partition_resolver_simple
; arguments = <meta-server-host>:27601
workflow_uri =
workflow_port = 27105
observability_uri =
observability_port = 27106
rasn_runtime_uri =
rasn_runtime_port = 27107
; Runtime-module discovery/registration. Module services publish their hosted
; module APIs to rasn.registry as lease-tracked capabilities such as
; rasn.runtime.resource_budget. An explicit rasn_runtime_* or <module>_* endpoint
; is authoritative; distributed/hybrid clients use registry discovery only for
; modules left unconfigured, then fall back to the static localhost endpoint.
rasn_runtime_registry_discovery_enabled = true
rasn_runtime_registry_registration_enabled = true
; Address this runtime host publishes to the registry for its module APIs. By
; default a host registers its rDSN primary_address(), which rDSN derives from the
; first non-loopback network interface -- on a multi-homed host, or one with a
; virtual/bridge NIC (Docker, VPN, VM), that can be an address remote clients cannot
; reach, so discovery-based clients would resolve an unreachable endpoint and time
; out. Set rasn_runtime_advertise_host to the address clients should dial: 127.0.0.1
; for a runtime that only serves same-host (co-located) clients, or the routable IP
; or DNS name of this host for a multi-machine deployment. The advertised port stays
; this host's real listen port; leave blank to keep primary_address(). A per-module
; override <module>_advertise_host is also honored (for example
; resource_budget_advertise_host). An invalid or unresolvable value is rejected and
; that module is not published to the registry.
rasn_runtime_advertise_host =
; Distributed runtime-module RPC resilience (client side). These govern how the
; distributed rasn_runtime provider calls each module service so cross-node
; latency and transient transport errors are tolerated instead of failing fast.
; rasn_runtime_timeout_ms defaults to [rasn.rpc] timeout_ms when 0.
rasn_runtime_timeout_ms = 0
; Extra retry attempts on transient RPC errors (timeout, network failure, busy,
; capacity exceeded, try-again). Total attempts = retries + 1.
rasn_runtime_retries = 2
; Linear backoff between retries (multiplied by the attempt number).
rasn_runtime_retry_backoff_ms = 50
; Dedicated timeout for lightweight module health pings ("doctor"/readiness), so
; probing an unreachable remote module stays fast and does not use the request
; timeout or retry budget.
rasn_runtime_ping_timeout_ms = 1000
; Optional per-module overrides use the module name as the key prefix, for
; example agent_control_plane_uri/host/port or resource_budget_uri/host/port.
; The timeout/retry/ping knobs accept the same per-module prefix, for example
; resource_budget_timeout_ms or blackboard_retries.
; This allows each runtime module API to run on its own remote node or URI-backed
; rDSN cluster while the default shared rasn.runtime service remains valid.
; Example:
; resource_budget_uri = dsn://meta-server:34601/rasn-resource-budget
; blackboard_host = remote-host
; blackboard_port = 27117
; Sharded modules (agent_message_bus, resource_budget, blackboard) can route by
; natural key when <module>_shard_count > 1. Per-shard endpoint knobs fall back
; to the per-module endpoint when omitted.
; blackboard_shard_count = 2
; blackboard_shard_0_host = blackboard-a
; blackboard_shard_0_port = 27117
; blackboard_shard_1_host = blackboard-b
; blackboard_shard_1_port = 27127
; Runtime module services can also publish explicit registry shard labels. On a
; standalone blackboard shard-0 process, set blackboard_hosted_shards = 0; a
; service intentionally hosting every shard can use "all". Clients query
; rasn.runtime.<module>.shard.<n> first, then fall back to module-level discovery
; and finally static endpoints.
; blackboard_hosted_shards = 0
;
; Hybrid provider routing (used when [rasn.runtime] rasn_runtime_provider = hybrid).
; Each module is placed independently: "local" runs it in-process, "remote" reaches
; it over RPC using the endpoint knobs above. rasn_runtime_default_mode sets the
; default for unlisted modules; <module>_mode overrides a single module.
rasn_runtime_default_mode = local
; Example: keep shared coordination state on dedicated nodes while agents call the
; other modules in-process.
; blackboard_mode = remote
; resource_budget_mode = remote
;
; Circuit breaker for remote module calls (client side). After
; rasn_runtime_breaker_failures consecutive transport failures to a module the
; breaker opens and calls short-circuit for rasn_runtime_breaker_open_ms before a
; half-open probe is admitted, so one dead module node cannot stall every request.
rasn_runtime_breaker_enabled = true
rasn_runtime_breaker_failures = 5
rasn_runtime_breaker_open_ms = 30000
;
; Idempotency for remote retries. When enabled the client stamps remote calls with
; a unique id stable across its own retries. Module services dedup mutating
; requests by full request signature plus id: a concurrent duplicate waits for the
; first in-flight response, then returns that response instead of applying twice.
; rasn_runtime_dedup_capacity bounds the per-service cache (0 disables dedup);
; rasn_runtime_dedup_ttl_ms bounds how long completed ids are retained (0 disables
; TTL expiry and relies on capacity only); rasn_runtime_dedup_wait_timeout_ms
; bounds how long duplicates can occupy RPC handler threads.
rasn_runtime_idempotency_enabled = true
rasn_runtime_dedup_capacity = 8192
rasn_runtime_dedup_ttl_ms = 300000
rasn_runtime_dedup_wait_timeout_ms = 5000
;
; Optional service-to-service auth for distributed runtime-module RPC. Keep this
; disabled for trusted local experiments. When enabled, every distributed/hybrid
; client and every runtime module service must be configured with the same token.
; Leave rasn_runtime_auth_token blank in checked-in configs; inject it through
; deployment-specific config or an environment-specific config overlay.
rasn_runtime_auth_enabled = false
rasn_runtime_auth_token =
;
; Distributed runtime-module state hydration. Remote-routed module mutations are
; mirrored into rasn.state under [rasn.runtime] rasn_runtime_state_prefix. Module
; services query that mirror on startup and hydrate only the modules they host, so
; standalone service restarts can recover their last mirrored state. When enabled,
; a module service retries the hydration query while a co-located state service is
; still registering its RPC handlers -- up to rasn_runtime_state_hydration_max_attempts
; attempts spaced by rasn_runtime_state_hydration_retry_backoff_ms -- and refuses to
; open its RPC API only after that readiness budget is exhausted or a non-transient
; error occurs; disable this only for intentionally cold local experiments.
; Watermarks add an explicit per-module durability contract: after each mirrored
; mutation, the provider writes a watermark containing the committed state-record
; sequence. Hydration verifies watermarks before replay so a torn or incomplete
; mirror fails closed instead of serving partial state.
rasn_runtime_state_hydration_enabled = true
rasn_runtime_state_hydration_timeout_ms = 500
; Readiness retry for a cold multi-process start (co-located rasn.state still coming
; up). Total wait budget is roughly max_attempts * (timeout_ms + retry_backoff_ms).
; The configured attempt count is honored as-is (no hidden cap), so raise it for an
; unusually long cold start.
rasn_runtime_state_hydration_max_attempts = 20
rasn_runtime_state_hydration_retry_backoff_ms = 250
rasn_runtime_state_watermark_enabled = true
rasn_runtime_state_watermark_verify_enabled = true
;
; Single-writer ownership gate for standalone runtime-module services. When
; enabled, a module service acquires ownership of every module (or hosted shard)
; it serves -- via the [rasn.coordination] backend below -- BEFORE opening its RPC
; API, and fails closed if another node already owns that module/shard. This makes
; a sharded/replicated module safe to deploy on more than one node without two
; services accepting writes for the same partition. Default off: the inproc
; coordination backend only coordinates within one process, so real cross-process
; single-writer enforcement requires provider = zookeeper (see below) plus
; THREAD_POOL_META_SERVER and THREAD_POOL_DLOCK. Leave off for single-node/local runs.
rasn_runtime_ownership_gate_enabled = false
;
; Ownership is acquired BEFORE the service hydrates its in-memory state from the
; mirror, so a standby that waits for the active owner to release cannot open its
; RPC API on a snapshot the active owner has since superseded. Each acquisition
; blocks up to [rasn.coordination] acquire_timeout_ms for the current owner to
; release; on sustained contention the service fails closed (rDSN aborts a non-OK
; start). rasn_runtime_ownership_acquire_max_attempts adds bounded in-process
; retries (spaced by rasn_runtime_ownership_acquire_retry_backoff_ms) so a standby
; can also ride out a brief ownership handover without an external restart. The
; default of 1 preserves the immediate fail-closed behavior; an always-on
; active/standby pair should still run under a supervisor that restarts the loser
; so it retries and wins once the active releases (see DISTRIBUTED_RUNTIME.md §10).
rasn_runtime_ownership_acquire_max_attempts = 1
rasn_runtime_ownership_acquire_retry_backoff_ms = 1000
; Stop accepting new module RPCs and drain admitted handlers before releasing
; ownership. Expiry is fail-stop: releasing while a mutation is still running
; could overlap it with the next owner.
rasn_runtime_request_drain_timeout_ms = 30000
;
; Core-service RPC resilience (client side) for the older, always-on rASN services
; reached over rDSN RPC: state, workflow, observability, and the registry discovery
; lookup that gates request routing. This mirrors the per-module runtime resilience
; above so every cross-node rASN dependency -- not just the 11 runtime modules --
; fails fast on an unhealthy endpoint and retries transient transport errors with
; backoff, reusing the shared circuit_breaker engine.
;
; Retries are idempotency-aware. Errors that prove the request never reached the
; server (network failure/init, busy, capacity-exceeded, try-again) are retried for
; any operation; an ambiguous ERR_TIMEOUT is only retried for idempotent operations
; (reads, key-overwrite writes) and never for non-idempotent mutations such as a
; compare-and-swap or starting a workflow run, so retries cannot double-apply.
; Total attempts = rasn_core_rpc_retries + 1. Timeout uses [rasn.rpc] timeout_ms.
rasn_core_rpc_retries = 2
rasn_core_rpc_backoff_ms = 50
rasn_core_rpc_breaker_enabled = true
rasn_core_rpc_breaker_failures = 5
rasn_core_rpc_breaker_open_ms = 30000

[rasn.rpc]
timeout_ms = 5000

[core]
tool = nativerun
data_dir = rasn/data
toollets = tracer, profiler
start_nfs = false
pause_on_start = false
cli_local = false
enable_default_app_mimic = true
logging_start_level = LOG_LEVEL_WARNING
logging_factory_name = dsn::tools::simple_logger

[tools.emulator]
random_seed = 2756568580
use_given_random_seed = true

[network]
io_service_worker_count = 2

[task..default]
is_trace = true
is_profile = true
allow_inline = false
rpc_call_channel = RPC_CHANNEL_TCP
rpc_message_header_format = dsn
rpc_timeout_milliseconds = 5000

; rDSN's type-1 replication layer uses these task attributes to route mutations
; through quorum commit before the rasn.state handler applies them. They are also
; safe for the standalone service app, where no layer-2 replication host exists.
[task.RPC_RASN_STATE_PUT]
rpc_request_is_write_operation = true

[task.RPC_RASN_STATE_PUT_CONDITIONAL]
rpc_request_is_write_operation = true

; Replicated rasn.state rejects operator-driven recovery deterministically; the
; write classification prevents it from bypassing the primary/quorum path.
[task.RPC_RASN_STATE_RECOVER]
rpc_request_is_write_operation = true

[threadpool..default]

[threadpool.THREAD_POOL_DEFAULT]
partitioned = false
worker_count = 2
worker_priority = THREAD_xPRIORITY_NORMAL

[threadpool.THREAD_POOL_RASN_WORKFLOW]
partitioned = false
worker_count = 2
worker_priority = THREAD_xPRIORITY_NORMAL

; Coordination thread pools are required ONLY by the 'simple'/'zookeeper'
; coordination backends (see [rasn.coordination] provider). The default 'inproc'
; backend never enqueues on them, so they are intentionally left undeclared here to
; keep this local single-process deployment runnable out of the box -- the pools are
; registered by the rDSN.dist.service providers, which are not loaded by the default
; [modules] list, so declaring one (in `pools` or below) without them yields
; "invalid enum configuration ... <POOL>" at startup.
;
; Which pools each backend needs (declare the pool section below AND add the pool to
; each hosting app's `pools` list, or rDSN aborts with "pool <NAME> not ready ...
; not designated in [apps.<app>] pools"):
;   * simple    -> THREAD_POOL_META_SERVER only. The simple lock provider runs its
;                  lease timer (LPC_DIST_LOCK_SVC_RANDOM_EXPIRE) there, and the rASN
;                  facade delivers its own grant/lease callbacks there too.
;   * zookeeper -> THREAD_POOL_META_SERVER (rASN facade callbacks) AND
;                  THREAD_POOL_DLOCK. The zookeeper lock provider runs its lock tasks
;                  (TASK_CODE_DLOCK) on THREAD_POOL_DLOCK and asserts single-thread
;                  access per lock, so declare it partitioned = true. (Declaring only
;                  THREAD_POOL_META_SERVER for a zookeeper backend core-dumps at
;                  startup with "pool THREAD_POOL_DLOCK not ready".)
;
; To switch to a distributed backend: (1) build with plugins (./run.sh build
; --build_plugins) so the dist providers register these pools, (2) set
; provider = simple|zookeeper under [rasn.coordination], (3) add the pool(s) above to
; each rASN app's `pools` list (the [apps.rasn.*] service sections here in
; config.rasn.ini, and the app's own [apps.rasn.<app>] in config.ini), and
; (4) uncomment the matching section(s) below. rASN never processes requests on
; these pools, so the facade's bounded blocking call cannot self-deadlock.
; [threadpool.THREAD_POOL_META_SERVER]
; partitioned = false
; worker_count = 2
; worker_priority = THREAD_xPRIORITY_NORMAL
;
; Additionally required by provider = zookeeper (must be partitioned):
; [threadpool.THREAD_POOL_DLOCK]
; partitioned = true
; worker_priority = THREAD_xPRIORITY_NORMAL

[apps.rasn.registry]
type = rasn.registry
arguments =
run = true
count = 1
ports = 27100
pools = THREAD_POOL_DEFAULT
; HA registry replicas additionally require:
; pools = THREAD_POOL_DEFAULT,THREAD_POOL_META_SERVER,THREAD_POOL_DLOCK
; Run one replica process per registry_addresses endpoint and give each process
; its matching `ports` value. Do not use count>1 as a substitute for node/process
; redundancy.

[apps.rasn.llm.agent]
type = rasn.llm.agent
arguments =
run = true
count = 1
ports = 27102
pools = THREAD_POOL_DEFAULT

[apps.rasn.tool.agent]
type = rasn.tool.agent
arguments =
run = true
count = 1
ports = 27103
pools = THREAD_POOL_DEFAULT

[apps.rasn.state]
type = rasn.state
arguments =
run = true
count = 1
ports = 27104
pools = THREAD_POOL_DEFAULT

; Core rASN services are still separate service apps. rasn.runtime below hosts
; runtime modules only, so coordinator/workflow/observability should not be
; merged into that app.
[apps.rasn.coordinator]
type = rasn.coordinator
arguments =
run = true
count = 1
ports = 27101
pools = THREAD_POOL_DEFAULT

[apps.rasn.workflow]
type = rasn.workflow
arguments =
run = true
count = 1
ports = 27105
pools = THREAD_POOL_DEFAULT,THREAD_POOL_RASN_WORKFLOW

[apps.rasn.observability]
type = rasn.observability
arguments =
run = true
count = 1
ports = 27106
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime]
type = rasn.runtime
arguments =
run = true
count = 1
ports = 27107
pools = THREAD_POOL_DEFAULT

; Optional standalone runtime module apps. They are run=true so app-list selection
; can launch them directly, but the default app service app-list still uses
; only rasn.runtime. To split modules across processes or nodes, launch a module
; role with a state service available for hydration (for example
; `<app> serve config.rasn.ini "rasn.state;resource_budget"`) and route clients with
; the matching [rasn.service] <module>_host/<module>_port or <module>_uri override.
[apps.rasn.runtime.agent_control]
type = rasn.runtime.agent_control
arguments =
run = true
count = 1
ports = 27110
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.message_bus]
type = rasn.runtime.message_bus
arguments =
run = true
count = 1
ports = 27111
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.task_kernel]
type = rasn.runtime.task_kernel
arguments =
run = true
count = 1
ports = 27112
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.determinism]
type = rasn.runtime.determinism
arguments =
run = true
count = 1
ports = 27113
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.capability]
type = rasn.runtime.capability
arguments =
run = true
count = 1
ports = 27114
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.budget]
type = rasn.runtime.budget
arguments =
run = true
count = 1
ports = 27115
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.recovery]
type = rasn.runtime.recovery
arguments =
run = true
count = 1
ports = 27116
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.blackboard]
type = rasn.runtime.blackboard
arguments =
run = true
count = 1
ports = 27117
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.contract]
type = rasn.runtime.contract
arguments =
run = true
count = 1
ports = 27118
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.human_interaction]
type = rasn.runtime.human_interaction
arguments =
run = true
count = 1
ports = 27119
pools = THREAD_POOL_DEFAULT

[apps.rasn.runtime.sandbox_runtime]
type = rasn.runtime.sandbox_runtime
arguments =
run = true
count = 1
ports = 27120
pools = THREAD_POOL_DEFAULT

; ---- shared module tuning defaults -----------------------------------------
; Behavior knobs shared by this runtime host and any local app that opts in.
; Loaded LAST. Registry/coordination backend choices also live there because they
; are consumed by both runtime services and shared resilience adapters; place HA
; registry overrides in config.rasn.defaults.ini (or in a deployment include
; loaded after it), not earlier in this host file. rDSN resolves this include beside
; THIS file: the `serve` entry point switches into this file's directory first, so
; it resolves regardless of the launch directory.
@include config.rasn.defaults.ini
